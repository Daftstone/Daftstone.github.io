<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
  <link rel="icon" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
  {% if site.google_analytics_id %}{% include analytics.html %}{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="wordmark" href="#about">Chenwang Wu<span>.</span></a>
    <nav aria-label="Main navigation">{% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}</nav>
  </div></header>
  <main id="main" class="site-main">{{ content }}</main>
  <footer class="site-footer"><div><a href="#about">Chenwang Wu</a><span>Hong Kong Baptist University</span></div><a href="https://github.com/{{ site.repository }}">Website source ↗</a></footer>
</body>
</html>
